<style>
:root{--bg:#0d0a0a;--deep:#070505;--lift:#1b1513;--cream:#ecd9c2;--dim:#b9a28a;--ink:#17100d;--brass:#d9b48f;--line:rgba(236,217,194,.2);--ok:#7fc58a;--wait:#e8c15a;--bad:#e5837b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6}
button,input,select{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:20;background:rgba(7,5,5,.95);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.top img{width:38px;height:38px;border-radius:50%;border:2px solid var(--brass)}
.top h1{font-size:18px;margin:0;flex:1;color:var(--brass)}
.btn{border:2px solid var(--brass);background:none;color:var(--brass);border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.fill{background:var(--brass);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.filters select,.filters input{background:var(--lift);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--lift);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{color:var(--dim);font-size:13px;font-weight:600}
.kpi .v{font-size:28px;font-weight:700}
.kpi .s{color:var(--dim);font-size:12px}
.panel{background:var(--lift);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.panel h2{margin:0 0 10px;font-size:17px}
.panel.vote{display:flex;flex-direction:column;justify-content:center}
.topmovie{font-size:30px;font-weight:700;color:var(--brass);text-align:center;padding:10px 0 4px;line-height:1.4}
.mvrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:8px;padding:9px 8px;border-top:1px solid var(--line);cursor:pointer;align-items:center;font-size:14px}
.mvrow.head{color:var(--dim);font-size:12px;cursor:default;border-top:0}
.mvrow.on{background:rgba(217,180,143,.14);border-radius:8px}
.mvrow b{color:var(--brass)}
.mvrow small{color:var(--wait);display:block;font-size:11px}
.btn.fill.closed{background:var(--bad);border-color:var(--bad);color:#3a0d09}
.seat{cursor:default!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.screen{height:18px;margin:0 12% 12px;border-top:3px solid var(--cream);border-radius:50% 50% 0 0/100% 100% 0 0;text-align:center;font-size:11px;color:var(--dim)}
.seats{display:grid;grid-template-columns:16px repeat(5,1fr) 12px repeat(5,1fr);gap:5px;direction:ltr;max-width:460px;margin:0 auto}
.rl{font-size:12px;font-weight:700;color:var(--dim);text-align:center;align-self:center}
.seat{aspect-ratio:1/.85;border-radius:7px 7px 3px 3px;font-size:10px;font-weight:700;padding:0;cursor:pointer;border:2px solid rgba(236,217,194,.35);background:none;color:var(--dim)}
.seat.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.seat.booked{background:var(--ok);border-color:var(--ok);color:#0e2a14;cursor:default}
.seat.wait{background:var(--wait);border-color:var(--wait);color:#3b2d00;cursor:default}
.seat.block{background:#555;border-color:#555;color:#ddd;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.list-head{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.list-head h2{margin:0;font-size:19px}
.pill{background:var(--brass);color:var(--ink);border-radius:20px;padding:0 10px;font-weight:700;font-size:14px}
.card{background:var(--lift);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
@media(max-width:620px){.card{grid-template-columns:1fr}}
.card b{font-size:16px}
.meta{color:var(--dim);font-size:13px}
.meta strong{color:var(--cream)}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;margin-inline-start:8px}
.badge.wait{background:rgba(232,193,90,.18);color:var(--wait)}
.badge.ok{background:rgba(127,197,138,.18);color:var(--ok)}
.badge.bad{background:rgba(229,131,123,.18);color:var(--bad)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.acts button{border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.a-ok{background:var(--ok);color:#0e2a14}.a-bad{background:var(--bad);color:#3a0d09}.a-wa{background:#25d366;color:#06210f}
.empty{text-align:center;color:var(--dim);padding:30px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;overflow-y:auto}
.ov.show{display:flex}
.box{background:var(--cream);color:var(--ink);border-radius:16px;padding:22px;width:100%;max-width:360px}
.box h2{margin:0 0 12px;font-size:20px}
.box input[type=text],.box input[type=password],.box input[type=date],.box input[type=number],.box input[type=tel]{width:100%;margin-bottom:9px;padding:11px 12px;border:2px solid rgba(23,16,13,.2);border-radius:10px;font-size:15px;background:#fffaf0;color:var(--ink)}
.box label.chk{display:block;margin:4px 0 12px;font-weight:700;font-size:14px}
.box .go{width:100%;background:var(--bg);color:var(--cream);border:0;border-radius:10px;padding:12px;font-weight:700;font-size:16px;cursor:pointer}
.box .no{width:100%;background:none;border:0;color:var(--ink);padding:10px;font-weight:700;cursor:pointer}
.err{color:#9b1c1c;font-weight:700;font-size:13px;min-height:20px;margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brass);color:var(--ink);padding:10px 20px;border-radius:12px;font-weight:700;transition:.25s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>

<div class="ov" id="login"><div class="box">
  <h2>دخول الأدمن</h2>
  <input type="password" id="pass" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="go" id="loginBtn">دخول</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzdOlfCaUqqc4S_KxHYQbSJ7H7JdG33qALSow3uZnntUpH5rF_IGyAb_v5E1I9fKq-yRw/exec"; // نفس رابط الصفحة الأساسية
const NAME = "Ninety Nights";
const ROWS = "ABCDEFG";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let pass = ''; try { pass = localStorage.getItem('mn_admin') || ''; } catch (e) {}
const savePass = p => { pass = p; try { localStorage.setItem('mn_admin', p); } catch (e) {} };
const clearPass = () => { pass = ''; try { localStorage.removeItem('mn_admin'); } catch (e) {} };

let all = [], votes = [], price = 200, bookingOpen = true, busy = false;

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function showLogin(msg) { $('loginErr').textContent = msg || ''; $('pass').value = ''; $('login').classList.add('show'); $('pass').focus(); }

async function api(action, data) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, pass }, data || {})) });
  const res = await r.json();
  if (res && res.error === 'unauthorized') { clearPass(); showLogin('كلمة السر غلط'); throw new Error('unauthorized'); }
  if (res && res.error === 'set_admin_pass') { showLogin('غيّر ADMIN_PASS في Code.gs الأول وانشر نسخة جديدة'); throw new Error('set_admin_pass'); }
  return res;
}

async function load() {
  if (!pass) { showLogin(); return; }
  try {
    const res = await api('admin_list');
    if (!res || !res.ok) { $('list').innerHTML = '<div class="empty">حصل خطأ في التحميل</div>'; return; }
    $('login').classList.remove('show');
    all = res.bookings || []; price = res.price || price; votes = res.votes || []; bookingOpen = res.booking_open !== false; renderToggle();
    fillDates(); fillMovies(); render();
  } catch (e) {
    if (!/unauthorized|set_admin_pass/.test(e.message)) $('list').innerHTML = '<div class="empty">ماقدرناش نوصل للسيرفر</div>';
  }
}

function fillDates() {
  const sel = $('fDate'), cur = sel.value;
  const dates = [...new Set(all.map(b => b.date))].sort().reverse();
  const today = new Date().toLocaleDateString('en-CA');
  const upcoming = dates.filter(d => d >= today).pop() || dates[0] || '';
  sel.innerHTML = '<option value="">كل التواريخ</option>' + dates.map(d => '<option value="' + esc(d) + '">' + esc(dayLabel(d)) + '</option>').join('');
  sel.value = cur && (cur === '' || dates.includes(cur)) ? cur : upcoming;
}
function fillMovies() {
  const sel = $('fMovie'), cur = sel.value;
  const ms = [...new Set(all.filter(b => b.phone !== '-' && b.movie).map(mv))].sort();
  sel.innerHTML = '<option value="">كل الأفلام</option>' + ms.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
  sel.value = ms.includes(cur) ? cur : '';
}
function dayLabel(d) {
  const x = new Date(d + 'T00:00:00');
  return isNaN(x) ? d : x.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
}
const NOMOV = 'بدون فيلم';
const mv = b => b.movie || NOMOV;
const isCan = b => b.status === 'ملغي';
const isWait = b => b.status === 'انتظار';

function render() {
  const fd = $('fDate').value, fm = $('fMovie').value, fs = $('fStatus').value, q = $('fSearch').value.trim().toLowerCase();
  const rows = all.filter(b => (!fd || b.date === fd) && (!fm || mv(b) === fm) && (!fs || b.status === fs) &&
    (!q || (b.name + ' ' + b.phone).toLowerCase().includes(q)));
  // KPIs على التاريخ المختار (من غير فلتر الحالة/البحث)
  const day = all.filter(b => (!fd || b.date === fd) && (!fm || mv(b) === fm) && b.phone !== '-');   // من غير الكراسي المقفولة
  const booked = day.filter(b => b.status === 'محجوز'), wait = day.filter(isWait), can = day.filter(isCan);
  const sum = (a, k) => a.reduce((s, b) => s + (Number(b[k]) || 0), 0);
  $('kBook').textContent = booked.length + wait.length;
  $('kBookS').textContent = (fd ? dayLabel(fd) : 'كل التواريخ') + (fm ? ' · ' + fm : '');
  $('kSeats').textContent = sum(booked, 'count');
  $('kSeatsS').textContent = 'من ' + 70;
  $('kWait').textContent = wait.length;
  $('kWaitS').textContent = sum(wait, 'count') + ' كرسي · ' + sum(wait, 'total') + ' جنيه';
  $('kCan').textContent = can.length;
  $('kRev').textContent = sum(booked, 'total');
  $('count').textContent = rows.length;
  drawMap(fd, fm); drawMovies(fd, fm); drawTopMovie();

  rows.sort((a, b) => a.date === b.date ? b.time.localeCompare(a.time) : b.date.localeCompare(a.date));
  if (!rows.length) { $('list').innerHTML = '<div class="empty">مفيش حجوزات مطابقة</div>'; return; }
  $('list').innerHTML = rows.map(b => {
    const cls = isCan(b) ? 'bad' : isWait(b) ? 'wait' : 'ok';
    const actions = (isCan(b) ? '<button class="a-ok" data-act="محجوز" data-row="' + b.row + '">استرجاع</button>'
      : (isWait(b) ? '<button class="a-ok" data-act="محجوز" data-row="' + b.row + '">تأكيد الحجز</button>' : '') +
        '<button class="a-bad" data-act="ملغي" data-row="' + b.row + '">إلغاء</button>') +
      (b.phone && b.phone !== '-' ? '<button class="a-wa" data-wa="' + b.row + '">واتساب</button>' : '');
    return '<div class="card"><div><b>' + esc(b.name) + '</b><span class="badge ' + cls + '">' + esc(b.status) + '</span>' +
      '<div class="meta">📅 <strong>' + esc(dayLabel(b.date)) + '</strong> · 🎟️ <strong>' + esc(b.seats.join('، ')) + '</strong> (' + b.count + ') · 💰 <strong>' + b.total + ' جنيه</strong></div>' +
      '<div class="meta">📱 ' + esc(b.phone) + ' · ⏱ ' + esc(b.time) + (b.movie ? ' · 🎬 ' + esc(b.movie) : '') + (isWait(b) ? (b.proof ? ' · 📩 بعت الإثبات' : ' · ⏳ مستني الدفع (بيتلغي بعد 15 دقيقة)') : '') + (b.order ? ' · 🍿 ' + esc(b.order) : '') + '</div></div>' +
      '<div class="acts">' + actions + '</div></div>';
  }).join('');
}

function drawMap(date, fm) {
  $('mapTitle').textContent = 'خريطة الكراسي' + (date ? ' — ' + dayLabel(date) : '') + (fm ? ' — ' + fm : '');
  const inMovie = b => !fm || b.phone === '-' || mv(b) === fm;
  if (!date) { $('seats').innerHTML = '<div class="empty" style="grid-column:1/-1">اختار تاريخ عشان تشوف الخريطة</div>'; return; }
  const state = {};
  all.filter(b => b.date === date && !isCan(b) && inMovie(b)).forEach(b => b.seats.forEach(s => {
    state[s] = b.phone === '-' ? 'block' : isWait(b) ? 'wait' : 'booked';
  }));
  const info = {};
  all.filter(b => b.date === date && !isCan(b) && inMovie(b)).forEach(b => b.seats.forEach(s => info[s] = b.name));
  let h = '';
  for (const r of ROWS) {
    h += '<div class="rl">' + r + '</div>';
    for (let n = 1; n <= 10; n++) {
      if (n === 6) h += '<div></div>';
      const id = r + n, st = state[id];
      h += '<button class="seat ' + (st || '') + '" disabled' + (st ? ' title="' + esc(info[id]) + '"' : '') + '>' + n + '</button>';
    }
  }
  $('seats').innerHTML = h;
}

function drawMovies(fd, fm) {
  const g = {};
  all.filter(b => b.phone !== '-' && b.movie && !isCan(b) && (!fd || b.date === fd)).forEach(b => {
    const k = mv(b), x = g[k] || (g[k] = { n: 0, seats: 0, rev: 0, wait: 0 });
    x.n++; x.seats += Number(b.count) || 0;
    if (isWait(b)) x.wait += Number(b.total) || 0; else x.rev += Number(b.total) || 0;
  });
  const keys = Object.keys(g).sort((a, b) => g[b].rev - g[a].rev);
  $('mvSub').textContent = fd ? '— ' + dayLabel(fd) : '— كل التواريخ';
  if (!keys.length) { $('mvTable').innerHTML = '<div class="empty">مفيش حجوزات</div>'; return; }
  $('mvTable').innerHTML = '<div class="mvrow head"><span>الفيلم</span><span>حجوزات</span><span>كراسي</span><span>إيراد مؤكد</span></div>' +
    keys.map(k => '<div class="mvrow' + (k === fm ? ' on' : '') + '" data-mv="' + esc(k) + '"><b>' + esc(k) + '</b><span>' + g[k].n + '</span><span>' + g[k].seats + '</span><span>' + g[k].rev + ' جنيه' +
      (g[k].wait ? '<small>+ ' + g[k].wait + ' انتظار</small>' : '') + '</span></div>').join('');
}

function drawTopMovie() {
  const counts = {};
  if (Array.isArray(votes)) votes.forEach(v => {
    const n = typeof v === 'string' ? v : (v && (v.movie || v.film || v.name || v.title));
    if (n) counts[n] = (counts[n] || 0) + ((v && Number(v.count)) || 1);
  });
  else if (votes && typeof votes === 'object') Object.entries(votes).forEach(([n, c]) => counts[n] = Number(c) || 0);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  $('topMovie').textContent = top ? top[0] : 'لسه مفيش تصويت';
  $('topMovieS').textContent = top ? top[1] + ' صوت' : '';
}

async function setStatus(row, status) {
  if (busy) return; busy = true;
  try {
    const r = await api('admin_status', { row, status });
    if (r.ok) { toast('اتسجلت الحالة: ' + status); await load(); }
    else toast(r.error === 'seat_taken' ? 'الكراسي دي اتحجزت لحد تاني: ' + (r.taken_ids || []).join('، ') : 'حصل خطأ');
  } catch (e) { if (!/unauthorized|set_admin_pass/.test(e.message)) toast('ماقدرناش نوصل للسيرفر'); }
  busy = false;
}

function waMessage(b) {
  const head = isWait(b) ? '⏳ *حجزك في انتظار تأكيد الدفع*' : '✅ *تم تأكيد حجزك*';
  const lines = ['*' + NAME + '*', head, '', '👤 ' + b.name, '🎟️ الكراسي: ' + b.seats.join('، ') + ' (' + b.count + ')', '💰 الإجمالي: ' + b.total + ' جنيه', '📅 ' + dayLabel(b.date)];
  if (b.movie) lines.splice(2, 0, '🎬 ' + b.movie);
  if (isWait(b)) lines.push('', 'ابعتلنا صورة التحويل عشان نأكد الحجز 🙏');
  else if (!isCan(b)) lines.push('', 'منتظرينك! 🎬🍿');
  return lines.join('\n');
}
function openWa(b) {
  let n = String(b.phone).replace(/\D/g, ''); if (n.startsWith('0')) n = '2' + n;
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(waMessage(b)), '_blank');
}

/* ---------- أحداث ---------- */
$('list').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'), w = e.target.closest('[data-wa]');
  if (a) setStatus(Number(a.dataset.row), a.dataset.act);
  if (w) openWa(all.find(b => b.row === Number(w.dataset.wa)));
});
['fDate', 'fMovie', 'fStatus'].forEach(id => $(id).addEventListener('change', () => render()));
$('fSearch').addEventListener('input', render);
$('mvTable').addEventListener('click', e => {
  const r = e.target.closest('[data-mv]'); if (!r) return;
  $('fMovie').value = $('fMovie').value === r.dataset.mv ? '' : r.dataset.mv;
  render();
});
$('refresh').addEventListener('click', load);
$('logout').addEventListener('click', () => { clearPass(); all = []; showLogin(); });
function doLogin() { const v = $('pass').value; if (!v) return; savePass(v); load(); }
$('loginBtn').addEventListener('click', doLogin);
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function renderToggle() {
  const b = $('toggleBtn');
  b.textContent = bookingOpen ? '🔒 الحجز مفتوح — اضغط للقفل' : '🔓 الحجز مقفول — اضغط للفتح';
  b.classList.toggle('closed', !bookingOpen);
}
$('toggleBtn').addEventListener('click', async () => {
  if (busy) return;
  const want = !bookingOpen;
  if (!want && !confirm('تقفل الحجز؟ محدش هيقدر يحجز لحد ما تفتحه تاني.')) return;
  busy = true;
  try {
    const r = await api('admin_booking', { open: want });
    if (r.ok) { bookingOpen = r.booking_open !== false; renderToggle(); toast(bookingOpen ? 'الحجز اتفتح' : 'الحجز اتقفل'); }
    else toast('حصل خطأ');
  } catch (e) { if (!/unauthorized|set_admin_pass/.test(e.message)) toast('ماقدرناش نوصل للسيرفر'); }
  busy = false;
});
renderToggle();

load();
</script>
</body>
</html>
